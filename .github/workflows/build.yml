name: Build Previews

on: [pull_request]

jobs:
  build-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Install Tools & Dependencies
        uses: ./.github/actions/install

      - name: Build
        run: pnpm package:build
  
      - name: Publish packages
        run: pnpm ci:snapshot
